spring.application.name=budgeting
# Groq - configuração compartilhada
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
# Chat
spring.ai.model.chat=openai
spring.ai.openai.chat.model=openai/gpt-oss-20b
# Transcrição
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.model=whisper-large-v3-turbo
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.response-format=json
spring.ai.openai.chat.extra-body.reasoning_format=hidden
# Banco de dados
spring.datasource.url=jdbc:mysql://localhost:3307/budgeting
spring.datasource.username=budgeting_user
spring.datasource.password=budgeting_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true