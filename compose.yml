services:
  mysql:
    image: mysql:9.6
    container_name: budgeting-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: budgeting
      MYSQL_USER: budgeting_user
      MYSQL_PASSWORD: budgeting_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - budgeting_mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  budgeting_mysql_data: